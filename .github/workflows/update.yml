name: Mise à jour quotidienne

on:
  schedule:
    - cron: "0 8 * * *"   # tous les jours à 08h00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Télécharger les nouveaux matchs
        continue-on-error: true
        run: python fetch_data.py

      - name: Calculer les prédictions
        run: python predict.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/games.csv predictions.csv docs/
          git commit -m "Mise à jour des prédictions" || echo "Rien à committer"
          git push
